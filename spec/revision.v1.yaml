openapi: 3.0.3

info:
  title: forge revision and state transport
  version: 1.0.0
  description: >-
    The Revision model and the get, put and list transport that every state
    engine implements. forge-ci writes revisions. forge-factory reads them.
    Neither depends on the other, they depend on this.

components:
  schemas:
    Spec:
      type: object
      additionalProperties: true
      description: >-
        Engine specific configuration. The core model fixes the shape of a
        revision. Each engine keeps this block for its own internals, so
        ci-state-git takes a path and a DynamoDB engine takes a table and a
        region, and nothing in the core model knows about either.

    Revision:
      type: object
      description: >-
        A tuple of repo commits at a moment in time. The id is derived from the
        tuple, so the same commits always give the same revision.
      required: [id, createdAt]
      properties:
        id:
          type: string
          minLength: 1
          description: >-
            Content derived identifier. Suffixed with -dirty when any repo has
            uncommitted changes, because an uncommitted break must not reuse a
            passing run.
        createdAt:
          type: string
          format: date-time
          description: When the revision was resolved.
        repos:
          type: object
          additionalProperties:
            type: string
          description: Repo name to commit SHA. Empty when the pipeline declares no repos.
        dirty:
          type: array
          items:
            type: string
          description: Repos with uncommitted changes, sorted.

    StateGetInput:
      type: object
      description: Read one record, or list under one kind when key is a prefix.
      required: [kind]
      properties:
        kind:
          type: string
          description: The record family. revision, run or owned.
        key:
          type: string
          description: Identifies the record within its kind. Nested keys use slashes.
        spec:
          $ref: '#/components/schemas/Spec'

    StatePutInput:
      type: object
      description: Write one record.
      required: [kind, key, payload]
      properties:
        kind:
          type: string
        key:
          type: string
        payload:
          type: string
          description: >-
            The record body. A string, not bytes. A byte array marshals to
            base64 and the generated MCP schema rejects it, which broke every
            state write while passing in process.
        spec:
          $ref: '#/components/schemas/Spec'

    StateGetOutput:
      type: object
      description: The result of a read. A missing record is found false, never an error.
      required: [found]
      properties:
        found:
          type: boolean
        payload:
          type: string

    StateListOutput:
      type: object
      description: The keys under one kind.
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: string

    Resource:
      type: object
      description: Something an engine needs to exist. Declared by engines, realized by managers.
      required: [kind, name]
      properties:
        kind:
          type: string
          description: Resource kind, for example directory or table.
        name:
          type: string
          description: Unique name within the kind.
        spec:
          $ref: '#/components/schemas/Spec'

    DeclareInput:
      type: object
      description: >-
        What an engine is asked with when it reports what it needs. It carries
        the engine's own spec block and the pipeline root, because an engine
        declares its resources before any record exists to name.
      properties:
        spec:
          $ref: '#/components/schemas/Spec'
        root:
          type: string
          description: >-
            The pipeline root on the local filesystem, for an engine whose
            spec names workspace files to read at declare time. Optional, so
            an engine that reads nothing keeps validating without it.
        stages:
          type: array
          description: >-
            The pipeline's stages by name, each with its substages, for a
            compute engine that renders the run as jobs. A state engine
            ignores them; they are here so the one declare input the core
            sends validates against every engine's schema.
          items:
            $ref: '#/components/schemas/DeclaredStage'

    DeclaredStage:
      type: object
      description: One stage of the pipeline, by name, with its substages.
      required: [name]
      properties:
        name:
          type: string
        displayName:
          type: string
          description: >-
            What to call this stage where a person reads it. Absent means the
            caller derives a title from the name, so a pipeline that says
            nothing still reads as words rather than as an identifier.
        substages:
          type: array
          items:
            $ref: '#/components/schemas/DeclaredSubstage'

    DeclaredSubstage:
      type: object
      description: One substage of a stage, by name.
      required: [name]
      properties:
        name:
          type: string
        displayName:
          type: string
          description: >-
            What to call this substage where a person reads it. Absent means
            the caller derives a title from the stage and substage names.
        needs:
          type: array
          items:
            type: string
          description: >-
            Substages of the same stage that must advance before this one
            runs, for a compute engine that renders one job per substage and
            has to wire the order between them. Absent means none.

    DeclareOutput:
      type: object
      description: What an engine needs to exist. An engine with no infrastructure returns an empty list.
      required: [resources]
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
